services:
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]   # AMQP, management UI (guest/guest)

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nomly
      POSTGRES_PASSWORD: nomly
      POSTGRES_DB: nomly
    ports: ["5432:5432"]
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./lakehouse:/lakehouse:ro
    post_start:
      - command: ["/bin/sh", "/lakehouse/postgres.sh", "init"]
    healthcheck:
      test: ["CMD", "/bin/sh", "/lakehouse/postgres.sh", "check"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: nomlyadmin
      MINIO_ROOT_PASSWORD: nomly-local-only
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes:
      - minio-data:/data
      - ./lakehouse:/lakehouse:ro
    post_start:
      - command: ["/bin/sh", "/lakehouse/minio.sh", "init"]
    healthcheck:
      test: ["CMD", "/bin/sh", "/lakehouse/minio.sh", "check"]
      interval: 5s
      timeout: 5s
      retries: 30

  trino:
    image: trinodb/trino:483
    ports: ["127.0.0.1:8080:8080"]
    environment:
      MINIO_ROOT_USER: nomlyadmin
      MINIO_ROOT_PASSWORD: nomly-local-only
      POSTGRES_USER: nomly
      POSTGRES_PASSWORD: nomly
    volumes:
      - ./lakehouse/lakehouse.properties:/etc/trino/catalog/lakehouse.properties:ro
      - ./lakehouse/postgres.properties:/etc/trino/catalog/postgres.properties:ro
      - ./lakehouse:/lakehouse:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    post_start:
      - command: ["/bin/sh", "/lakehouse/trino.sh", "init"]
    healthcheck:
      test: ["CMD", "/bin/sh", "/lakehouse/trino.sh", "check"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 18

  adminer:
    image: adminer
    depends_on: [postgres]
    ports: ["8081:8080"]
    environment:
      ADMINER_DEFAULT_SERVER: postgres   # so you only type user/password/db

  producer:
    image: python:3.12-slim
    depends_on: [rabbitmq]
    restart: unless-stopped
    volumes:
      - ./producer.py:/producer.py:ro
    command: sh -c "pip install -q --disable-pip-version-check --root-user-action=ignore pika && python -u /producer.py"

volumes:
  minio-data:
