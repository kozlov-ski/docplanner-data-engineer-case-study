nomly:
  target: local
  outputs:
    local:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'localhost') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      user: "{{ env_var('TRINO_USER', 'dbt') }}"
      database: "{{ env_var('TRINO_CATALOG', 'lakehouse') }}"
      schema: "{{ env_var('NOMLY_ANALYTICS_SCHEMA', 'analytics') }}"
      threads: 1
      timezone: UTC
      http_scheme: http
      retries: 1
      session_properties:
        query_max_run_time: 2m
